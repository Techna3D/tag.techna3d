<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Danilo C. Martins | Engenheiro Mecânico</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f3f5;
            color: #222;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 30px 15px;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            overflow: hidden;
        }

        .header {
            background: #111827;
            color: white;
            padding: 35px 30px 30px;
            text-align: center;
        }

        .initials {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: white;
            color: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
        }

        .header h1 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 16px;
            color: #d1d5db;
        }

        .content {
            padding: 30px;
        }

        .company {
            text-align: center;
            margin-bottom: 25px;
        }

        .company strong {
            display: block;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .company span {
            color: #666;
            font-size: 14px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Botões principais */
        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            text-decoration: none;
            text-align: center;

            padding: 14px;

            border-radius: 10px;

            font-size: 16px;
            font-weight: bold;

            border: 1px solid #ddd;

            color: #222;
            background: #fafafa;

            transition: 0.2s;
            cursor: pointer;
        }

        .button:hover {
            background: #eeeeee;
            transform: translateY(-1px);
        }

        /* Botão de salvar contato */
        .primary {
            background: #111827;
            color: white;
            border-color: #111827;
        }

        .primary:hover {
            background: #1f2937;
        }

        /* Ícones dos botões */
        .icon {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }

        .footer {
            text-align: center;
            padding: 18px;
            font-size: 12px;
            color: #999;
            border-top: 1px solid #eee;
        }

        @media (max-width: 400px) {

            .header h1 {
                font-size: 22px;
            }

            .content {
                padding: 25px 20px;
            }

        }
    </style>
</head>

<body>

    <div class="card">

        <!-- Cabeçalho -->
        <div class="header">

            <div class="initials">
                DCM
            </div>

            <h1>Danilo C. Martins</h1>

            <p>Engenheiro Mecânico</p>

        </div>


        <!-- Conteúdo principal -->
        <div class="content">

            <div class="company">

                <strong>Techna 3D Engenharia</strong>

                <span>
                    Projetos Mecânicos • Desenvolvimento de Produtos
                </span>

            </div>


            <div class="buttons">


                <!-- Adicionar aos contatos -->
                <a
                    id="contactButton"
                    class="button primary"
                    href="#"
                    onclick="adicionarContato()">

                    <!-- Ícone de contato -->
                    <svg
                        class="icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>

                        <circle cx="9" cy="7" r="4"></circle>

                        <line x1="19" y1="8" x2="19" y2="14"></line>

                        <line x1="22" y1="11" x2="16" y2="11"></line>

                    </svg>

                    <span id="contactText">
                        Adicionar aos contatos
                    </span>

                </a>


                <!-- WhatsApp -->
                <a
                    class="button"
                    href="https://wa.me/5531988817172?text=Ol%C3%A1%2C%20Danilo%21%20Cheguei%20atrav%C3%A9s%20da%20sua%20TAG%20digital."
                    target="_blank">

                    <!-- Ícone WhatsApp -->
                    <svg
                        class="icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <path d="M21 11.5a8.4 8.4 0 0 1-9 8.5 8.5 8.5 0 0 1-4-.9L3 20l1-4a8.5 8.5 0 1 1 17-4.5z"></path>

                        <path d="M8.5 8.5c.3-.6.7-.6 1-.1l.8 1.2c.2.3.2.6 0 .9l-.5.6c.5 1 1.3 1.8 2.3 2.3l.6-.5c.3-.2.6-.2.9 0l1.2.8c.5.3.5.7-.1 1-.7.4-1.5.5-2.3.2-1.5-.5-3.5-2.5-4-4-.3-.8-.2-1.6.1-2.4z"></path>

                    </svg>

                    WhatsApp

                </a>


                <!-- LinkedIn -->
                <a
                    class="button"
                    href="https://www.linkedin.com/in/dcmartins/"
                    target="_blank">

                    <!-- Ícone LinkedIn -->
                    <svg
                        class="icon"
                        viewBox="0 0 24 24"
                        fill="currentColor">

                        <path d="M6.5 8.5H3V21h3.5V8.5ZM4.75 3A2.05 2.05 0 1 0 4.75 7.1 2.05 2.05 0 0 0 4.75 3ZM21 13.8c0-3.76-2.01-5.51-4.7-5.51-2.17 0-3.14 1.19-3.68 2.03V8.5H9.1V21h3.52v-6.19c0-1.63.31-3.21 2.33-3.21 1.99 0 2.02 1.87 2.02 3.31V21H21v-7.2Z"/>

                    </svg>

                    LinkedIn

                </a>


                <!-- Instagram -->
                <a
                    class="button"
                    href="https://www.instagram.com/Techna3D/"
                    target="_blank">

                    <!-- Ícone Instagram -->
                    <svg
                        class="icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <rect x="3" y="3" width="18" height="18" rx="5"></rect>

                        <circle cx="12" cy="12" r="4"></circle>

                        <circle cx="17.5" cy="6.5" r="1"></circle>

                    </svg>

                    Instagram

                </a>


                <!-- E-mail -->
                <a
                    class="button"
                    href="mailto:Danilo@Techna3D.com.br">

                    <!-- Ícone e-mail -->
                    <svg
                        class="icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <rect x="3" y="5" width="18" height="14" rx="2"></rect>

                        <polyline points="3,7 12,13 21,7"></polyline>

                    </svg>

                    E-mail

                </a>


            </div>

        </div>


        <!-- Rodapé -->
        <div class="footer">
            tag.techna3d.com.br
        </div>

    </div>


    <script>

        // Função para criar e baixar o cartão de contato
        function adicionarContato() {

            const vcard =
`BEGIN:VCARD
VERSION:3.0
FN:Danilo Martins Techna 3D
N:Techna3D;Danilo Martins;;;
ORG:Techna 3D Engenharia
TITLE:Engenheiro Mecânico
TEL;TYPE=CELL:+5531988817172
EMAIL;TYPE=WORK:Danilo@Techna3D.com.br
URL:https://www.linkedin.com/in/dcmartins/
URL:https://www.instagram.com/Techna3D/
END:VCARD`;


            // Cria o arquivo VCF na memória
            const blob = new Blob(
                [vcard],
                { type: "text/vcard;charset=utf-8" }
            );


            // Cria um endereço temporário para o arquivo
            const url = URL.createObjectURL(blob);


            // Cria um link temporário para fazer o download
            const link = document.createElement("a");

            link.href = url;

            link.download = "Danilo_Martins_Techna3D.vcf";


            // Executa o download
            document.body.appendChild(link);

            link.click();

            document.body.removeChild(link);


            // Libera o endereço temporário
            URL.revokeObjectURL(url);


            // Altera o texto do botão
            const contactText =
                document.getElementById("contactText");

            contactText.textContent =
                "Contato Salvo!";


            // Altera o ícone para um check
            const contactButton =
                document.getElementById("contactButton");

            contactButton.querySelector("svg").innerHTML = `
                <polyline points="20 6 9 17 4 12"></polyline>
            `;


            // Depois de 3 segundos, volta ao texto original
            setTimeout(function () {

                contactText.textContent =
                    "Adicionar aos contatos";

                contactButton.querySelector("svg").innerHTML = `
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <line x1="19" y1="8" x2="19" y2="14"></line>
                    <line x1="22" y1="11" x2="16" y2="11"></line>
                `;

            }, 3000);

        }

    </script>

</body>

</html>
