    <script>


        /* ==========================================================
           ADICIONAR CONTATO
           ========================================================== */

        function adicionarContato() {


            /* Dados do contato */

            const vcard =
`BEGIN:VCARD
VERSION:3.0
FN:Danilo Techna 3D
N:Techna3D;Danilo Martins;;;
ORG:Techna 3D Engenharia
TITLE:Diretor Técnico
TEL;TYPE=CELL:+5531988817172
EMAIL;TYPE=WORK:Danilo@Techna3D.com.br
URL:https://www.linkedin.com/in/dcmartins/
URL:https://www.instagram.com/Techna3D/
END:VCARD`;


            /* Cria o arquivo VCF */

            const blob = new Blob(
                [vcard],
                {
                    type: "text/vcard;charset=utf-8"
                }
            );


            /* Cria uma URL temporária */

            const url = URL.createObjectURL(blob);


            /* Cria um link temporário */

            const link = document.createElement("a");

            link.href = url;

            link.download = "Danilo_Martins_Techna3D.vcf";


            /* Adiciona o link */

            document.body.appendChild(link);


            /* Simula o clique */

            link.click();


            /* Remove o link */

            document.body.removeChild(link);


            /* Libera a memória */

            URL.revokeObjectURL(url);


            /* ======================================================
               ALTERA O BOTÃO PARA "CONTATO SALVO!"
               ====================================================== */

            const botao =
                document.getElementById("contatoButton");

            const texto =
                document.getElementById("contatoTexto");


            texto.textContent = "Contato Salvo!";


            /* Troca o ícone por um check */

            botao.querySelector("svg").innerHTML = `

                <polyline
                    points="20 6 9 17 4 12"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />

            `;


            /* ======================================================
               VOLTA AO NORMAL APÓS 3 SEGUNDOS
               ====================================================== */

            setTimeout(function() {


                texto.textContent =
                    "+ Adicionar aos contatos";


                botao.querySelector("svg").innerHTML = `

                    <path
                        d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                        cx="9"
                        cy="7"
                        r="4"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    />

                        x1="19"

                        y2="14"
                        stroke="currentColor"
                        stroke-width="2"

                        x2="16"
                        y2="11"
                        stroke="currentColor"
                        stroke-width="2"

                    />

                `;

            }, 3000);

        }
