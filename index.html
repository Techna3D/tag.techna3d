<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Danilo C. Martins | Engenheiro Mecânico</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f3f5;
            color: #222;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 30px 15px;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            overflow: hidden;
        }

        .header {
            background: #111827;
            color: white;
            padding: 35px 30px 30px;
            text-align: center;
        }

        .initials {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: white;
            color: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
        }

        .header h1 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 16px;
            color: #d1d5db;
        }

        .content {
            padding: 30px;
        }

        .company {
            text-align: center;
            margin-bottom: 25px;
        }

        .company strong {
            display: block;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .company span {
            color: #666;
            font-size: 14px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .button {
            display: block;
            text-decoration: none;
            text-align: center;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            border: 1px solid #ddd;
            color: #222;
            background: #fafafa;
            transition: 0.2s;
            cursor: pointer;
        }

        .button:hover {
            background: #eeeeee;
            transform: translateY(-1px);
        }

        .primary {
            background: #111827;
            color: white;
            border-color: #111827;
        }

        .primary:hover {
            background: #1f2937;
        }

        .footer {
            text-align: center;
            padding: 18px;
            font-size: 12px;
            color: #999;
            border-top: 1px solid #eee;
        }

        @media (max-width: 400px) {
            .header h1 {
                font-size: 22px;
            }

            .content {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="header">

            <div class="initials">
                DCM
            </div>

            <h1>Danilo C. Martins</h1>

            <p>Engenheiro Mecânico</p>

        </div>

        <div class="content">

            <div class="company">
                <strong>Techna 3D Engenharia</strong>
                <span>Projetos Mecânicos • Desenvolvimento de Produtos</span>
            </div>

            <div class="buttons">

                <!-- Adicionar aos contatos -->
                <a class="button primary" href="#" onclick="adicionarContato()">
                    + Adicionar aos contatos
                </a>

                <!-- WhatsApp -->
                <a
                    class="button"
                    href="https://wa.me/5531988817172?text=Ol%C3%A1%2C%20Danilo%21%20Cheguei%20atrav%C3%A9s%20da%20sua%20TAG%20digital."
                    target="_blank">
                    WhatsApp
                </a>

                <!-- E-mail -->
                <a
                    class="button"
                    href="mailto:Danilo@Techna3D.com.br">
                    E-mail
                </a>

                <!-- LinkedIn -->
                <a
                    class="button"
                    href="https://www.linkedin.com/in/dcmartins/"
                    target="_blank">
                    LinkedIn
                </a>

                <!-- Instagram -->
                <a
                    class="button"
                    href="https://www.instagram.com/Techna3D/"
                    target="_blank">
                    Instagram
                </a>

            </div>

        </div>

        <div class="footer">
            tag.techna3d.com.br
        </div>

    </div>


    <script>

        function adicionarContato() {

            const vcard =
`BEGIN:VCARD
VERSION:3.0
FN:Danilo Martins Techna 3D
N:Techna3D;Danilo Martins;;;
ORG:Techna 3D Engenharia
TITLE:Engenheiro Mecânico
TEL;TYPE=CELL:+5531988817172
EMAIL;TYPE=WORK:Danilo@Techna3D.com.br
URL:https://www.linkedin.com/in/dcmartins/
URL:https://www.instagram.com/Techna3D/
END:VCARD`;

            const blob = new Blob(
                [vcard],
                { type: "text/vcard;charset=utf-8" }
            );

            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");
            link.href = url;
            link.download = "Danilo_Martins_Techna3D.vcf";

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            URL.revokeObjectURL(url);
        }

    </script>

</body>

</html>
